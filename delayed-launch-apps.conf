# delayed-launch.rb が遅延起動するアプリ（1行1つ、bundle ID）
# macOS 27 でログイン時にアクセシビリティ権限を再要求されるもの
# Thaw は先頭に置く（メニューバーの整理が先に効き、起動の進み具合が見て分かる）
com.stonerl.Thaw                    # Thaw
com.runningwithcrayons.Alfred nohide # Alfred 5（再要求は出ないが、黙って権限が効かなくなる）
com.hegenberg.BetterTouchTool       # BetterTouchTool
com.pilotmoon.popclip               # PopClip
pl.wojciechkulik.FlashSpace         # FlashSpace
com.cordlessdog.Stay                # Stay
com.tapbots.Pastebot3Mac            # Pastebot
com.lowtechguys.Pipiri              # Pipiri
me.damir.dropover-mac nohide        # Dropover（再要求は出ないが、動きがおかしくなる）
com.runjuu.Input-Source-Pro nohide  # Input Source Pro（同上）
com.culturedcode.ThingsMacSandboxHelper nohide restart # Thingsヘルパー（同上。自分でログイン項目に戻るので、起動済みなら終了させて起動し直す）
com.lwouis.alt-tab-macos nohide     # AltTab（隠した状態で起動すると動かない）
